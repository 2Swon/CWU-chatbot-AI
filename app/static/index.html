<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청운대학교 챗봇 성능 비교</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header class="bg-primary text-white text-center py-4">
        <h1>청운대학교 챗봇 성능 비교</h1>
        <p class="lead">LangChain vs GraphRAG 접근 방식 비교</p>
    </header>

    <div class="container my-5">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h2 class="text-center mb-0">질문 입력</h2>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" id="questionInput" class="form-control" placeholder="청운대학교에 관한 질문을 입력하세요..." aria-label="질문 입력">
                            <button class="btn btn-primary" type="button" id="askButton">
                                <i class="fas fa-paper-plane"></i> 질문하기
                            </button>
                        </div>
                        <div class="d-flex justify-content-center my-2">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="modelType" id="langchainOption" value="langchain" checked>
                                <label class="form-check-label" for="langchainOption">LangChain만</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="modelType" id="graphragOption" value="graphrag">
                                <label class="form-check-label" for="graphragOption">GraphRAG만</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="modelType" id="compareOption" value="compare">
                                <label class="form-check-label" for="compareOption">둘 다 비교</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="loadingSpinner" class="text-center my-4 d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">응답을 생성하는 중입니다...</p>
                </div>

                <!-- 단일 응답 카드 (LangChain 또는 GraphRAG만 선택했을 때) -->
                <div id="singleResponseCard" class="card d-none mb-4">
                    <div class="card-header bg-light">
                        <h3 class="mb-0" id="singleResponseTitle">응답</h3>
                    </div>
                    <div class="card-body">
                        <p id="singleResponseContent" class="mb-0"></p>
                    </div>
                </div>

                <!-- 비교 응답 카드 (둘 다 비교할 때) -->
                <div id="comparisonCard" class="d-none">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header bg-primary text-white">
                                    <h3 class="mb-0">LangChain 응답</h3>
                                </div>
                                <div class="card-body">
                                    <p id="langchainResponse" class="mb-0"></p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header bg-success text-white">
                                    <h3 class="mb-0">GraphRAG 응답</h3>
                                </div>
                                <div class="card-body">
                                    <p id="graphragResponse" class="mb-0"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 평가 실행 섹션 -->
                <div class="card">
                    <div class="card-header bg-light">
                        <h3 class="mb-0 text-center">성능 평가 실행</h3>
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="sampleCount">평가 질문 수</label>
                                    <input type="number" id="sampleCount" class="form-control" value="10" min="5" max="50">
                                </div>
                            </div>
                            <div class="col-md-6 text-center">
                                <button id="runEvaluationBtn" class="btn btn-success mt-3">
                                    <i class="fas fa-chart-bar"></i> 성능 평가 실행
                                </button>
                            </div>
                        </div>
                        <div id="evaluationResult" class="mt-4 d-none">
                            <h4 class="text-center mb-3">평가 결과</h4>
                            <div id="evaluationChartContainer">
                                <canvas id="evaluationChart"></canvas>
                            </div>
                            <div id="evaluationDetails" class="mt-3">
                                <!-- 결과 상세 내용이 여기에 표시됩니다 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2025 청운대학교 챗봇 프로젝트</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
